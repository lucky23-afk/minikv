name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint, Race & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.1.7

      - name: Set up Go
        uses: actions/setup-go@v5.0.2
        with:
          go-version: '1.24'
          cache: true

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files require gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1
          staticcheck ./...

      - name: Run tests with race detector and coverage
        run: |
          go test -race -v -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Print coverage summary
        run: |
          go tool cover -func=coverage.out

      - name: Build all binaries
        run: |
          mkdir -p bin
          go build -trimpath -o bin/minikv-node ./cmd/minikv-node
          go build -trimpath -o bin/minikv-coord ./cmd/minikv-coord
          go build -trimpath -o bin/loadgen ./cmd/loadgen

      - name: Run benchmark smoke test
        run: |
          go test -bench=BenchmarkLRU_Put -benchtime=500ms -run=^# ./internal/lru

      - name: Build Docker image
        run: |
          docker build -t minikv:ci .
